openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Versioned API for the Smart Help Desk IT services application
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration and login
  - name: dashboard
    description: Live ticket metrics and recent activity
  - name: tickets
    description: Ticket lifecycle and comments
  - name: users
    description: Team member lookup for assignments
  - name: knowledge
    description: Admin-managed knowledge documents and grounded assistance
  - name: attachments
    description: Private ticket file uploads and authorized downloads
  - name: assistant
    description: AI-first troubleshooting, escalation, and knowledge-gap review
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an employee account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Employee account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Email or password is incorrect
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the authenticated account
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get live ticket metrics for the authenticated user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /v1/activity:
    get:
      operationId: listRecentActivity
      tags: [dashboard]
      summary: List recent ticket activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent ticket activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List team members for ticket assignment
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
  /v1/tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: Search and paginate tickets visible to the authenticated user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TicketPriority"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/TicketCategory"
        - name: department
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ticket page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a ticket for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /v1/tickets/{ticket_id}:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a ticket and its details
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Ticket not found
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update a ticket subject to role and ownership rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "403":
          description: Insufficient role or ticket ownership
  /v1/tickets/{ticket_id}/comments:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listTicketComments
      tags: [tickets]
      summary: List comments on a ticket
      responses:
        "200":
          description: Ticket comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketComment"
    post:
      operationId: createTicketComment
      tags: [tickets]
      summary: Add a comment to a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketComment"
  /v1/tickets/{ticket_id}/attachments:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listTicketAttachments
      tags: [attachments]
      summary: List files attached to a ticket the user can access
      responses:
        "200":
          description: Ticket attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketAttachment" }
  /v1/tickets/{ticket_id}/attachments/upload-url:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestTicketAttachmentUpload
      tags: [attachments]
      summary: Request a private signed upload URL for a ticket attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketAttachmentUploadInput"
      responses:
        "201":
          description: Short-lived upload URL and attachment identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketAttachmentUploadResponse"
        "403":
          description: The user cannot access this ticket
  /v1/tickets/{ticket_id}/attachments/{attachment_id}/complete:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: completeTicketAttachmentUpload
      tags: [attachments]
      summary: Verify and finalize a ticket attachment upload
      responses:
        "200":
          description: Finalized attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketAttachment"
        "409":
          description: The uploaded file is not yet available in App Storage
        "422":
          description: The uploaded file size did not match the request
  /v1/tickets/{ticket_id}/attachments/{attachment_id}/download:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTicketAttachmentDownload
      tags: [attachments]
      summary: Get a short-lived signed download URL for a ticket attachment
      responses:
        "200":
          description: Signed download link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketAttachmentDownload"
  /v1/tickets/{ticket_id}/attachments/{attachment_id}:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteTicketAttachment
      tags: [attachments]
      summary: Delete an attachment uploaded by the user or managed by support staff
      responses:
        "204":
          description: Attachment deleted
        "404":
          description: Attachment not found or the user is not permitted to remove it
  /v1/tickets/{ticket_id}/ai-resolution:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: getTicketResolutionHelp
      tags: [knowledge]
      summary: Suggest ticket troubleshooting steps grounded in approved knowledge
      responses:
        "200":
          description: Grounded resolution suggestion with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundedAnswer"
        "403":
          description: The user cannot view this ticket
  /v1/tickets/{ticket_id}/assistant-context:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTicketAssistantContext
      tags: [assistant]
      summary: Get the AI troubleshooting conversation linked to a ticket
      responses:
        "200":
          description: The AI summary, employee answers, retrieval results, and related issues
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AssistantSession"
                  - type: "null"
        "403":
          description: The user cannot view this ticket
  /v1/assistant/sessions:
    get:
      operationId: listAssistantSessions
      tags: [assistant]
      summary: List the authenticated user's troubleshooting sessions
      responses:
        "200":
          description: Recent sessions visible to the user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantSession" }
    post:
      operationId: createAssistantSession
      tags: [assistant]
      summary: Start a persisted AI troubleshooting session
      responses:
        "201":
          description: New support session ready for its first employee message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSession"
  /v1/assistant/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAssistantSession
      tags: [assistant]
      summary: Resume a troubleshooting session
      responses:
        "200":
          description: Session transcript and current outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSession"
        "404":
          description: Session not found
  /v1/assistant/sessions/{session_id}/messages:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendAssistantMessage
      tags: [assistant]
      summary: Send a reply and continue AI issue triage and grounded retrieval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageInput"
      responses:
        "200":
          description: Updated conversation, diagnosis, sources, and next decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSession"
        "503":
          description: The configured AI provider or local search index is unavailable
  /v1/assistant/sessions/{session_id}/retry:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: retryAssistantTurn
      tags: [assistant]
      summary: Retry a failed assistant response without duplicating the employee message
      responses:
        "200":
          description: Reprocessed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSession"
  /v1/assistant/sessions/{session_id}/resolution:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmAssistantResolution
      tags: [assistant]
      summary: Record whether the employee's issue was resolved by self-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantResolveInput"
      responses:
        "200":
          description: Resolved history record or escalation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSession"
  /v1/assistant/sessions/{session_id}/escalate:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createEscalatedTicket
      tags: [assistant]
      summary: Create and intelligently route the employee-confirmed support ticket
      responses:
        "200":
          description: Escalated ticket and linked conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSession"
  /v1/assistant/knowledge-gaps:
    get:
      operationId: listKnowledgeGaps
      tags: [assistant]
      summary: Review open knowledge gaps (administrators only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
      responses:
        "200":
          description: Knowledge gaps and linked escalation tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KnowledgeGap" }
  /v1/assistant/knowledge-gaps/{gap_id}/close:
    parameters:
      - name: gap_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: closeKnowledgeGap
      tags: [assistant]
      summary: Mark a knowledge gap as reviewed (administrators only)
      responses:
        "200":
          description: Updated knowledge gap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeGap"
  /v1/knowledge/documents/upload-url:
    post:
      operationId: requestKnowledgeUpload
      tags: [knowledge]
      summary: Request a private App Storage upload URL (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUploadInput"
      responses:
        "201":
          description: Short-lived upload URL and document identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUploadResponse"
        "403":
          description: Administrator access required
  /v1/knowledge/documents:
    get:
      operationId: listKnowledgeDocuments
      tags: [knowledge]
      summary: List knowledge documents (administrators only)
      responses:
        "200":
          description: Knowledge documents and indexing status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KnowledgeDocument" }
  /v1/knowledge/documents/{document_id}/ingest:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: ingestKnowledgeDocument
      tags: [knowledge]
      summary: Index an uploaded document (administrators only)
      responses:
        "202":
          description: Document queued for indexing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "409":
          description: Document is already being indexed
  /v1/knowledge/documents/{document_id}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteKnowledgeDocument
      tags: [knowledge]
      summary: Delete a knowledge document and its indexed passages (administrators only)
      responses:
        "204":
          description: Document removed
        "404":
          description: Document not found
  /v1/knowledge/search:
    post:
      operationId: searchKnowledge
      tags: [knowledge]
      summary: Ask a natural-language question against the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchInput"
      responses:
        "200":
          description: Grounded answer and citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundedAnswer"
        "503":
          description: The assistant or local knowledge index is unavailable
  /v1/knowledge/tickets/{ticket_id}/resolution-draft:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getKnowledgeResolutionDraft
      tags: [knowledge]
      summary: Prepare a reviewed article draft from a resolved ticket (administrators only)
      responses:
        "200":
          description: Draft content that can be edited and uploaded as a knowledge article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeResolutionDraft"
        "409":
          description: The ticket has no publishable resolution
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserRole:
      type: string
      enum: [employee, support_engineer, admin]
    TicketStatus:
      type: string
      enum: [open, in_progress, waiting_on_requester, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, normal, high, urgent]
    TicketCategory:
      type: string
      enum: [account_access, hardware, network, software, email, security, other]
    User:
      type: object
      required: [id, name, email, role, department, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        department: { type: string }
        created_at: { type: string, format: date-time }
    UserSummary:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
    RegisterInput:
      type: object
      required: [name, email, password, department]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        department: { type: string, minLength: 2, maxLength: 120 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    Ticket:
      type: object
      required: [id, number, title, description, category, priority, status, department, requester, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        department: { type: string }
        requester: { $ref: "#/components/schemas/UserSummary" }
        assigned_engineer:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        resolution: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: ["string", "null"], format: date-time }
    TicketInput:
      type: object
      required: [title, description, category, department]
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        description: { type: string, minLength: 10, maxLength: 12000 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        department: { type: string, minLength: 2, maxLength: 120 }
    TicketUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        description: { type: string, minLength: 10, maxLength: 12000 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        department: { type: string, minLength: 2, maxLength: 120 }
        assigned_engineer_id: { type: ["string", "null"], format: uuid }
        resolution: { type: ["string", "null"], maxLength: 12000 }
    TicketPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    TicketComment:
      type: object
      required: [id, ticket_id, author, body, created_at]
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserSummary" }
        body: { type: string }
        created_at: { type: string, format: date-time }
    TicketAttachmentUploadInput:
      type: object
      required: [filename, content_type, size_bytes]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, minLength: 1, maxLength: 120 }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
    TicketAttachmentUploadResponse:
      type: object
      required: [attachment_id, object_path, upload_url]
      properties:
        attachment_id: { type: string, format: uuid }
        object_path: { type: string }
        upload_url: { type: string, format: uri }
    TicketAttachment:
      type: object
      required: [id, filename, content_type, size_bytes, status, created_at, uploaded_by]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        status: { type: string, enum: [uploading, ready] }
        created_at: { type: string, format: date-time }
        uploaded_by: { $ref: "#/components/schemas/UserSummary" }
    TicketAttachmentDownload:
      type: object
      required: [download_url]
      properties:
        download_url: { type: string, format: uri }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 8000 }
    CountByLabel:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    EngineerWorkload:
      type: object
      required: [engineer, open_tickets]
      properties:
        engineer: { $ref: "#/components/schemas/UserSummary" }
        open_tickets: { type: integer }
    DashboardSummary:
      type: object
      required: [open_tickets, resolved_tickets, closed_tickets, urgent_tickets, by_category, by_department, engineer_workload]
      properties:
        open_tickets: { type: integer }
        resolved_tickets: { type: integer }
        closed_tickets: { type: integer }
        urgent_tickets: { type: integer }
        by_category:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        by_department:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        engineer_workload:
          type: array
          items: { $ref: "#/components/schemas/EngineerWorkload" }
    ActivityItem:
      type: object
      required: [id, ticket_id, ticket_number, actor, action, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        ticket_number: { type: string }
        actor: { $ref: "#/components/schemas/UserSummary" }
        action: { type: string }
        detail: { type: string }
        created_at: { type: string, format: date-time }
    KnowledgeUploadInput:
      type: object
      required: [title, filename, content_type, size_bytes]
      properties:
        title: { type: string, minLength: 2, maxLength: 180 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, minLength: 1, maxLength: 120 }
        size_bytes: { type: integer, minimum: 1, maximum: 15728640 }
    KnowledgeUploadResponse:
      type: object
      required: [document_id, object_path, upload_url]
      properties:
        document_id: { type: string, format: uuid }
        object_path: { type: string }
        upload_url: { type: string, format: uri }
    KnowledgeDocument:
      type: object
      required: [id, title, filename, content_type, size_bytes, status, chunk_count, error_message, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        status: { type: string, enum: [uploading, queued, processing, ready, error] }
        chunk_count: { type: integer }
        error_message: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    KnowledgeSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 3, maxLength: 2000 }
    Citation:
      type: object
      required: [document_id, title, filename, excerpt, chunk_index, relevance]
      properties:
        document_id: { type: string, format: uuid }
        title: { type: string }
        filename: { type: string }
        excerpt: { type: string }
        chunk_index: { type: integer }
        relevance: { type: number }
    GroundedAnswer:
      type: object
      required: [answer, citations, needs_human_support]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        needs_human_support: { type: boolean }
    AssistantMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 2, maxLength: 4000 }
    AssistantResolveInput:
      type: object
      required: [solved]
      properties:
        solved: { type: boolean }
    AssistantMessage:
      type: object
      required: [role, content, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }
        kind: { type: string, enum: [message, follow_up] }
    AssistantAnalysis:
      type: object
      required:
        - problem_summary
        - issue_type
        - category
        - department
        - priority
        - priority_reason
        - symptoms
        - timeline
        - device
        - operating_system
        - error_message
        - affected_users
        - business_impact
        - troubleshooting_attempted
        - likely_area
        - confidence
        - escalation_reason
        - recommended_action
      properties:
        problem_summary: { type: string }
        issue_type: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        department: { type: string }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        priority_reason: { type: string }
        symptoms:
          type: array
          items: { type: string }
        timeline: { type: string }
        device: { type: string }
        operating_system: { type: string }
        error_message: { type: string }
        affected_users: { type: string }
        business_impact: { type: string }
        troubleshooting_attempted:
          type: array
          items: { type: string }
        likely_area: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        escalation_reason: { type: string }
        recommended_action: { type: string }
    RelatedTicket:
      type: object
      required: [id, number, title, status, relevance]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        resolution: { type: ["string", "null"] }
        relevance: { type: number, minimum: 0, maximum: 1 }
    AssistantSession:
      type: object
      required:
        - id
        - status
        - messages
        - analysis
        - answer
        - related_tickets
        - ticket_id
        - ticket_number
        - assigned_engineer
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [triage, solution_proposed, escalation_preview, resolved, escalated] }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AssistantMessage" }
        analysis:
          anyOf:
            - $ref: "#/components/schemas/AssistantAnalysis"
            - type: "null"
        answer:
          anyOf:
            - $ref: "#/components/schemas/GroundedAnswer"
            - type: "null"
        related_tickets:
          type: array
          items: { $ref: "#/components/schemas/RelatedTicket" }
        ticket_id: { type: ["string", "null"], format: uuid }
        ticket_number: { type: ["string", "null"] }
        assigned_engineer:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KnowledgeGap:
      type: object
      required: [id, session_id, ticket_id, ticket_number, query_text, department, category, priority, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        ticket_id: { type: ["string", "null"], format: uuid }
        ticket_number: { type: ["string", "null"] }
        query_text: { type: string }
        department: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        reason: { type: string }
        status: { type: string, enum: [open, closed] }
        created_at: { type: string, format: date-time }
    KnowledgeResolutionDraft:
      type: object
      required: [ticket_id, ticket_number, title, filename, content_type, markdown]
      properties:
        ticket_id: { type: string, format: uuid }
        ticket_number: { type: string }
        title: { type: string }
        filename: { type: string }
        content_type: { type: string }
        markdown: { type: string }

