openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Versioned API for the Smart Help Desk IT services application
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration and login
  - name: dashboard
    description: Live ticket metrics and recent activity
  - name: tickets
    description: Ticket lifecycle and comments
  - name: users
    description: Team member lookup for assignments
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an employee account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Employee account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Email or password is incorrect
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the authenticated account
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get live ticket metrics for the authenticated user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /v1/activity:
    get:
      operationId: listRecentActivity
      tags: [dashboard]
      summary: List recent ticket activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent ticket activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List team members for ticket assignment
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
  /v1/tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: Search and paginate tickets visible to the authenticated user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TicketPriority"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/TicketCategory"
        - name: department
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ticket page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a ticket for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /v1/tickets/{ticket_id}:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a ticket and its details
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Ticket not found
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update a ticket subject to role and ownership rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "403":
          description: Insufficient role or ticket ownership
  /v1/tickets/{ticket_id}/comments:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listTicketComments
      tags: [tickets]
      summary: List comments on a ticket
      responses:
        "200":
          description: Ticket comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketComment"
    post:
      operationId: createTicketComment
      tags: [tickets]
      summary: Add a comment to a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketComment"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserRole:
      type: string
      enum: [employee, support_engineer, admin]
    TicketStatus:
      type: string
      enum: [open, in_progress, waiting_on_requester, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, normal, high, urgent]
    TicketCategory:
      type: string
      enum: [account_access, hardware, network, software, email, security, other]
    User:
      type: object
      required: [id, name, email, role, department, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        department: { type: string }
        created_at: { type: string, format: date-time }
    UserSummary:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
    RegisterInput:
      type: object
      required: [name, email, password, department]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        department: { type: string, minLength: 2, maxLength: 120 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    Ticket:
      type: object
      required: [id, number, title, description, category, priority, status, department, requester, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        title: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        department: { type: string }
        requester: { $ref: "#/components/schemas/UserSummary" }
        assigned_engineer:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        resolution: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: ["string", "null"], format: date-time }
    TicketInput:
      type: object
      required: [title, description, category, department]
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        description: { type: string, minLength: 10, maxLength: 12000 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        department: { type: string, minLength: 2, maxLength: 120 }
    TicketUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        description: { type: string, minLength: 10, maxLength: 12000 }
        category: { $ref: "#/components/schemas/TicketCategory" }
        priority: { $ref: "#/components/schemas/TicketPriority" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        department: { type: string, minLength: 2, maxLength: 120 }
        assigned_engineer_id: { type: ["string", "null"], format: uuid }
        resolution: { type: ["string", "null"], maxLength: 12000 }
    TicketPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    TicketComment:
      type: object
      required: [id, ticket_id, author, body, created_at]
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserSummary" }
        body: { type: string }
        created_at: { type: string, format: date-time }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 8000 }
    CountByLabel:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    EngineerWorkload:
      type: object
      required: [engineer, open_tickets]
      properties:
        engineer: { $ref: "#/components/schemas/UserSummary" }
        open_tickets: { type: integer }
    DashboardSummary:
      type: object
      required: [open_tickets, resolved_tickets, closed_tickets, urgent_tickets, by_category, by_department, engineer_workload]
      properties:
        open_tickets: { type: integer }
        resolved_tickets: { type: integer }
        closed_tickets: { type: integer }
        urgent_tickets: { type: integer }
        by_category:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        by_department:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        engineer_workload:
          type: array
          items: { $ref: "#/components/schemas/EngineerWorkload" }
    ActivityItem:
      type: object
      required: [id, ticket_id, ticket_number, actor, action, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        ticket_number: { type: string }
        actor: { $ref: "#/components/schemas/UserSummary" }
        action: { type: string }
        detail: { type: string }
        created_at: { type: string, format: date-time }

