[project]
name = "smart-help-desk-api"
version = "0.1.0"
description = "FastAPI backend for the Smart Help Desk ticketing system"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.24.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]
